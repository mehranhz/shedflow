global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'shedflow'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - node-exporter:9100

  # Apps run on the Docker host (pnpm dev). On Linux, ensure host.docker.internal
  # resolves (Compose adds it on Desktop; Linux may need extra_hosts).
  - job_name: shedflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3001']

  - job_name: shedflow-billing
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3002']

  - job_name: shedflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3003']
