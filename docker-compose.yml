# Profiles:
#   core            — Postgres + NestJS API (apps/api). `docker compose up -d postgres` still works.
#   observability   — Prometheus, Grafana, node-exporter, Alertmanager
#
#   docker compose --profile core up -d
#   docker compose --profile observability up -d
#   docker compose --profile core --profile observability up -d
#
# With COMPOSE_PROFILES=core,observability in `.env`, `docker compose up -d`
# starts both stacks. Host DATABASE_URL uses localhost:5533; the api container
# uses hostname `postgres:5432`. Apply migrations from the host:
#   pnpm db:migrate:deploy
services:
  prometheus:
    image: docker.arvancloud.ir/prom/prometheus:latest
    container_name: prometheus
    profiles: ['observability']
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./observability/prometheus/alerts
        target: /etc/prometheus/alerts
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9350:9090"
    networks:
      - monitoring
    mem_limit: 2g
    mem_reservation: 1g

  grafana:
    image: docker.arvancloud.ir/grafana/grafana:10.4.0
    container_name: grafana
    profiles: ['observability']
    restart: unless-stopped
    user: "472"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_HTTP_PORT=3000
      # Host port 3300 so Next.js can own :3000 (T-035 / mvp/12).
      - GF_SERVER_ROOT_URL=http://localhost:3300
      - GF_SERVER_PROTOCOL=http
      - GF_LOG_LEVEL=info
      # Option 2: Use the new preinstall method (replaces deprecated GF_INSTALL_PLUGINS)
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,grafana-simple-json-datasource
      # If you want to skip plugin installation entirely, use:
      # - GF_PLUGINS_PREINSTALL=
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "3300:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    mem_limit: 1g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  node-exporter:
    image: docker.arvancloud.ir/prom/node-exporter:latest
    container_name: node-exporter
    profiles: ['observability']
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    ports:
      - "9353:9100"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m

  alertmanager:
    image: docker.arvancloud.ir/prom/alertmanager:latest
    container_name: alertmanager
    profiles: ['observability']
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./observability/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9351:9093"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m

  postgres:
    image: postgres:16-alpine
    container_name: shedflow-postgres
    profiles: ['core']
    restart: unless-stopped
    environment:
      POSTGRES_USER: shedflow
      POSTGRES_PASSWORD: shedflow
      POSTGRES_DB: shedflow
    ports:
      - '5533:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init-test-db.sql
        target: /docker-entrypoint-initdb.d/init-test-db.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shedflow -d shedflow']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shedflow

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: shedflow-api:local
    container_name: shedflow-api
    profiles: ['core']
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Inside the compose network, not the host-mapped 5533.
      DATABASE_URL: postgresql://shedflow:shedflow@postgres:5432/shedflow?schema=public
      DIRECT_DATABASE_URL: postgresql://shedflow:shedflow@postgres:5432/shedflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-change-me-in-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:3001}
      BILLING_URL: ${BILLING_URL:-http://localhost:3002}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shedflow
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

networks:
  shedflow:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  postgres-data:

  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local