services:
  postgres:
    image: postgres:16-alpine
    container_name: shedflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shedflow
      POSTGRES_PASSWORD: shedflow
      POSTGRES_DB: shedflow
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shedflow -d shedflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
